name: Test Backend

on:
  push:
    branches:
      - master
  pull_request:
permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run migrations and tests in an isolated database
        run: |
          docker compose -p docflow-test -f compose.test.yml up \
            --build \
            --abort-on-container-exit \
            --exit-code-from backend-tests
      - name: Clean up isolated test environment
        if: always()
        run: docker compose -p docflow-test -f compose.test.yml down --volumes --remove-orphans
